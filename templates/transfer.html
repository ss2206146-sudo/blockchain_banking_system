{% extends "base.html" %}
{% block title %}Transfer{% endblock %}
{% block content %}
<div class="form-card">
<h2>Transfer Money</h2>
<p class="muted">Enter the recipient's account number.</p>
<form method="POST">
<label>Receiver Account Number</label><input name="receiver" required>
<label>Amount (₹)</label><input type="number" name="amount" min="1" step="0.01" required>
<button class="btn" type="submit">Transfer</button>
</form>
</div>
{% endblock %}
